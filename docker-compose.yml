services:
  backend:
    build: ./backend
    environment:
      VNUCHOK_SECRET_KEY: ${VNUCHOK_SECRET_KEY:-change-me-in-prod}
      VNUCHOK_DEMO_MODE: ${VNUCHOK_DEMO_MODE:-1}
      # Для PostgreSQL: postgresql+psycopg://user:pass@db:5432/vnuchok
      VNUCHOK_DATABASE_URL: sqlite:////data/vnuchok.db
    volumes:
      - vnuchok-data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  vnuchok-data:
